name: Terraform Plan

# Manual-only Terraform plan workflow.
# No automatic PR execution.

on:
  workflow_dispatch:

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-prod:
    permissions:
      id-token: write        # Required for OIDC token exchange
      contents: read
      pull-requests: write   # Required to post plan comment
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-plan.yml@5606584d4d99f3f0886517c4e637aa0b19308898 # v1.1.3
    with:
      environment: "prod"
      chdir: "terraform/stack"
    secrets: inherit
