name: DevOps / Go CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-tidy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@82f1d226aeec60e696b6716213e10742caf3875e # v1.6.0
    with:
      go-version: "1.25"
      runner: '["ubuntu-latest"]'
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-inventory"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN_ORG }}

  fmt:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@82f1d226aeec60e696b6716213e10742caf3875e # v1.6.0
    with:
      go-version: "1.25"
      runner: '["ubuntu-latest"]'
      working-directory: "."

  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure private Go module access
        env:
          GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN_ORG }}
        run: |
          set -euo pipefail
          {
            echo "GOPRIVATE=github.com/FelipeFuhr/ffreis-platform-inventory"
            echo "GONOSUMCHECK=1"
          } >> "$GITHUB_ENV"
          if [ -n "$GIT_AUTH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          # Pinned binary install (the action's default) rather than goinstall:
          # golangci-lint/v2 raises its own Go floor independently of this repo's
          # toolchain -- v2.14.0 requires Go >= 1.26 while go.mod pins 1.25 with
          # GOTOOLCHAIN=local, so `go install` refuses. The published binary has
          # no such constraint, and is faster.
          version: v2.14.0
          args: --path-prefix=. --timeout=5m

  test:
    needs: [fmt]
    permissions:
      contents: read
      # go-test.yml's job unconditionally requests id-token: write for its L2
      # S3-cache OIDC step (no-op here — we pass no go-cache-s3 input, so the
      # step never runs). The caller must still grant the ceiling or GitHub
      # rejects the whole workflow file at parse time with "the nested job
      # 'test' is requesting 'id-token: write', but is only allowed
      # 'id-token: none'" — confirmed live on this PR.
      id-token: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@82f1d226aeec60e696b6716213e10742caf3875e # v1.6.0
    with:
      go-version: "1.25"
      runner: '["ubuntu-latest"]'
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-inventory"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN_ORG }}

  coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@82f1d226aeec60e696b6716213e10742caf3875e # v1.6.0
    with:
      go-version: "1.25"
      runner: '["ubuntu-latest"]'
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-inventory"
      coverage-threshold: 75
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN_ORG }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-integration-coverage.yml@82f1d226aeec60e696b6716213e10742caf3875e # v1.6.0
    with:
      go-version: "1.25"
      runner: '["ubuntu-latest"]'
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-inventory"
      coverage-threshold: 75
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN_ORG }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
